#  Stack de Streaming WebRTC 
# Cinco servicios:
#   streamer      → proceso Python: captura con FFmpeg, sirve la señalización
#                   WebRTC en :8081 y la API REST de grabaciones
#   web           → Nginx: frontend estático + proxy inverso para /offer, /api/,
#                   /metrics, /hls/ (directo) y /recordings/ (descarga)
#   prometheus    → scraping de /metrics cada 15 s (streamer + node-exporter)
#   grafana       → dashboards sobre Prometheus en :3000
#   node-exporter → métricas del SO del host (CPU, RAM, disco, red)
#
# Por qué network_mode:host en el streamer: aiortc tiene que anunciar la IP real
# del host en los ICE candidates. Con la IP del contenedor (172.x.x.x) los
# navegadores en la LAN no pueden establecer la conexión WebRTC.
# 
services:

  #  STREAMER 
  # Ejecuta streamer/main.py:
  #   1. Lanza FFmpeg (cámara V4L2 + audio ALSA → libx264/aac → tee muxer)
  #   2. FFmpeg escribe simultáneamente en UDP:10000 (pipe en vivo) y en
  #      ficheros .ts segmentados por fecha/hora en /recordings/
  #   3. aiortc MediaPlayer lee el UDP y distribuye el stream via MediaRelay
  #   4. Cada /offer del navegador crea una RTCPeerConnection nueva contra el relay
  streamer:
    build: ./streamer
    container_name: video-streamer
    privileged: true        # necesario para acceder a /dev/video* y ALSA
    network_mode: host      # obligatorio: aiortc necesita la IP real del host para ICE
    devices:
      - "/dev/video0:/dev/video0"   # cámara principal V4L2
      - "/dev/video1:/dev/video1"   # cámara secundaria (no se usa por defecto)
      - "/dev/snd:/dev/snd"         # subsistema de audio ALSA
    environment:
      - INPUT=${INPUT:-/dev/video0}                # dispositivo o fichero de entrada para FFmpeg
      - USE_NVENC=${USE_NVENC:-false}              # codificación hardware con NVIDIA (requiere GPU)
      - HLS_DIR=/var/www/hls                       # donde FFmpeg deja los segmentos HLS en vivo
      - RECORD_DIR=/recordings                     # donde FFmpeg deja los .ts de grabación
      - UDP_PORT=10000                             # puerto del pipe interno FFmpeg → aiortc
      - VIDEO_SCALE=${VIDEO_SCALE:-1280:720}       # resolución de salida
      - SEGMENT_DURATION=${SEGMENT_DURATION:-1800} # segundos por fichero de grabación (1800 = 30 min)
    volumes:
      - hls-data:/var/www/hls      # compartido con web: FFmpeg escribe, nginx lee
      - recordings:/recordings     # compartido con web: streamer escribe, nginx sirve
    deploy:
      restart_policy:
        condition: any             # siempre reiniciar; si FFmpeg falla, se recupera solo

  #  WEB: FRONTEND + PROXY INVERSO 
  # Nginx sirve el HTML/CSS del visor y actúa como punto de entrada único para
  # el navegador, reenviando al aiohttp del streamer las rutas /offer, /api/ y /metrics.
  web:
    build: ./nginx
    container_name: hls-web
    depends_on:
      - streamer
    ports:
      - "8080:8080"                # puerto visible en la LAN
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro       # config montada en solo lectura
      - ./nginx/html:/usr/share/nginx/html:ro             # index.html, recordings.html, CSS, imágenes
      - hls-data:/var/www/hls                             # lee los segmentos HLS del streamer
      - recordings:/var/www/recordings:ro                 # sirve los .ts para descarga (solo lectura)
    restart: unless-stopped
    networks:
      - streaming_network

  #  MONITORIZACIÓN: PROMETHEUS 
  # Recoge métricas cada 15 s de:
  #   host.docker.internal:8081/metrics → streamer (bitrate, FPS, peers WebRTC, latencia)
  #   node-exporter:9100               → SO del host (CPU, RAM, disco, red)
  #   localhost:9090                   → automonitorización de Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: resuelve la IP del host para llegar al
                                              # streamer que corre con network_mode:host
    environment:
      - GF_LOG_LEVEL=error
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml   # targets y cadencia
      - prometheus_data:/prometheus                                   # TSDB persistente
    command: --config.file=/etc/prometheus/prometheus.yml --web.enable-lifecycle
    restart: unless-stopped
    networks:
      - monitoring_network

  #  MONITORIZACIÓN: GRAFANA
  # Visualización de las métricas de Prometheus. Tras el primer arranque,
  # Prometheus se añade como datasource desde la UI en :3000.
  grafana:
    image: grafana/grafana
    container_name: grafana
    environment:
      - GF_LOG_LEVEL=error
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana   # persiste dashboards, usuarios y datasources
    depends_on:
      - prometheus
    networks:
      - monitoring_network

  #  MONITORIZACIÓN: NODE EXPORTER 
  # Exporta métricas reales del hardware/SO. Monta el sistema de ficheros del host
  # en solo lectura para reportar datos del host, no del contenedor.
  node-exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.rootfs=/host'       # leer /proc y /sys del host, no del contenedor
    volumes:
      - '/:/host:ro'                # sistema de ficheros del host (solo lectura)
    environment:
      - GF_LOG_LEVEL=error
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - monitoring_network

#  REDES 
# Dos redes separadas para que el tráfico de monitorización no interfiera
# con el de streaming. El streamer queda fuera de ambas por usar network_mode:host.
networks:
  streaming_network:
    driver: bridge    # web (nginx) ↔ resto del stack de streaming
  monitoring_network:
    driver: bridge    # prometheus ↔ grafana ↔ node-exporter

#  VOLÚMENES 
volumes:
  hls-data:          # segmentos HLS en vivo: streamer escribe, nginx lee
  recordings:        # ficheros .ts de grabación: streamer escribe, nginx sirve (solo lectura)
  grafana-data:      # estado de Grafana: dashboards, usuarios, configuración de datasources
  prometheus_data:   # base de datos de series temporales de Prometheus (TSDB)

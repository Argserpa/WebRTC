# ─── Configuración de Nginx ───────────────────────────────────────────────────
# Servidor HTTP único en el puerto 8080 con seis grupos de rutas:
#
#   /              → ficheros estáticos del frontend (HTML, CSS, imágenes)
#   /hls/          → segmentos HLS en vivo (.m3u8 + .ts) que genera FFmpeg
#   /recordings/   → ficheros .ts de grabación para descarga directa
#   /api/recordings→ API de metadatos de grabaciones (proxy al streamer :8081)
#   /offer         → señalización SDP WebRTC (proxy al streamer :8081)
#   /metrics       → métricas Prometheus (proxy al streamer :8081)
#
# Nota sobre el proxy: se usa localhost:8081 porque el streamer corre con
# network_mode:host. En Kubernetes/minikube las líneas activas pasan a ser las
# de http://video-streamer:8081, y las de localhost quedan comentadas.
# ──────────────────────────────────────────────────────────────────────────────

worker_processes 1;
events { worker_connections 1024; }   # máximo de conexiones simultáneas por worker

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;       # sendfile() del kernel: evita copias en espacio de usuario para estáticos
    tcp_nopush    on;       # agrupa paquetes TCP (mejor throughput para ficheros grandes)
    keepalive_timeout 65;   # segundos que se mantiene una conexión idle abierta

    server {
        listen 8080;
        server_name _;      # acepta cualquier Host header

        # ── Frontend estático ─────────────────────────────────────────────────
        # index.html    → visor WebRTC en directo con badge de latencia RTT
        # recordings.html → navegador de grabaciones por fecha con player y descarga
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # ── Stream HLS en vivo ────────────────────────────────────────────────
        # FFmpeg va escribiendo aquí los playlists .m3u8 y los segmentos .ts.
        # Cache-Control: no-cache es imprescindible — hls.js pide el playlist
        # cada pocos segundos y si lo cachea el stream se congela.
        # autoindex on: permite ver los segmentos en el navegador para depurar.
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;   # tipo MIME del playlist HLS (obligatorio en Safari)
                video/mp2t ts;                         # tipo MIME del segmento MPEG-TS
            }
            alias /var/www/hls/;
            autoindex on;
            add_header Cache-Control "no-cache";              # nunca cachear playlists
            add_header Access-Control-Allow-Origin *;         # permite fetch cross-origin desde JS
        }

        # ── Descarga de grabaciones ───────────────────────────────────────────
        # Sirve los ficheros .ts directamente para que el navegador los descargue.
        # Accept-Ranges: bytes activa las peticiones HTTP range, lo que permite
        # reanudar descargas interrumpidas y hacer seek en el player.
        location /recordings/ {
            alias /var/www/recordings/;
            autoindex off;   # no exponer el listado de directorio

            types {
                video/mp2t ts;
            }

            add_header Accept-Ranges bytes;                        # habilita descargas reanudables
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "private, max-age=3600";      # caché de 1 hora; las grabaciones no cambian
        }

        # ── API de metadatos de grabaciones ───────────────────────────────────
        # Reenvía al servidor aiohttp del streamer:
        #   GET /api/recordings               → { dates: [{date, count}] }
        #   GET /api/recordings/{YYYY-MM-DD}  → { files: [{name, display_time, size_mb, url}] }
        #   GET /api/recordings/{fecha}/{fichero}/playlist.m3u8 → playlist HLS VOD
        location /api/recordings {
            proxy_pass http://video-streamer:8081; # Kubernetes: nombre del Service
            #proxy_pass http://localhost:8081;       # Docker Compose: streamer en red del host
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Señalización WebRTC ───────────────────────────────────────────────
        # El navegador hace POST con su SDP offer (JSON); nginx lo reenvía a aiortc.
        # aiortc procesa la offer, añade los tracks del MediaRelay y devuelve la answer.
        # A partir de ahí, navegador y servidor negocian los ICE candidates directamente.
        location /offer {
            proxy_pass http://video-streamer:8081/offer; # Kubernetes: nombre del Service
            #proxy_pass http://localhost:8081;             # Docker Compose: streamer en red del host
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Type $content_type;
            proxy_pass_request_body on;
        }

        # ── Métricas Prometheus ───────────────────────────────────────────────
        # Expone /metrics en formato texto de Prometheus; Prometheus lo scrapea
        # cada 15 s (configurado en monitoring/prometheus.yml).
        # Métricas: TFG_ffmpeg_*, TFG_webrtc_*, TFG_streaming_latency_*, TFG_app_uptime_seconds
        location /metrics {
            proxy_pass http://video-streamer:8081/metrics; # Kubernetes: nombre del Service
            #proxy_pass http://localhost:8081;               # Docker Compose: streamer en red del host
        }
    }
}

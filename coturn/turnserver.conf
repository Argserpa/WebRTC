# ─── Configuración del servidor TURN/STUN (coturn) ────────────────────────────
# Este servidor ayuda a los peers WebRTC a atravesar el NAT cuando el UDP directo
# está bloqueado. Los ICE candidates se intentan en este orden:
#   host → srflx (STUN) → relay (TURN)
# El relay solo se usa si las dos primeras opciones fallan.
#
# Las credenciales de aquí DEBEN coincidir con la config iceServers del navegador
# (index.html) y del streamer (main.py RTCConfiguration).
# ──────────────────────────────────────────────────────────────────────────────

# ── Puertos de escucha ─────────────────────────────────────────────────────────
listening-port=3478         # STUN/TURN por UDP y TCP (puerto estándar IANA)
tls-listening-port=5349     # TURNS: TURN cifrado sobre TLS

# ── IP externa ────────────────────────────────────────────────────────────────
# Al correr detrás de NAT o Docker, coturn necesita anunciar una IP alcanzable
# desde fuera en sus respuestas STUN (no la IP del contenedor).
# $(detect-external-ip) la detecta automáticamente al arrancar.
external-ip=$(detect-external-ip)

# ── Autenticación ─────────────────────────────────────────────────────────────
# Credenciales estáticas de largo plazo. El TURN necesita autenticación para
# evitar que el servidor se use como relay abierto.
# En producción lo habitual son credenciales HMAC con expiración.
user=turnuser:turnpass       # formato: usuario:contraseña
realm=midominio.local        # Identifica este servidor; debe coincidir con el cliente

# ── Logs ──────────────────────────────────────────────────────────────────────
verbose                      # registra allocaciones y eventos ICE (en producción se desactiva)

# ── Rango de puertos de relay ─────────────────────────────────────────────────
# Para cada allocación TURN, coturn elige un puerto UDP de este rango.
# Todo el rango tiene que estar abierto en el firewall y mapeado en docker-compose/k8s.
min-port=49152
max-port=65535

# ── Filtro de IPs de destino ──────────────────────────────────────────────────
# Permite relay hacia cualquier IP. En producción este rango se acota a los peers
# conocidos para evitar que el servidor funcione como relay abierto.
allowed-peer-ip=0.0.0.0-255.255.255.255

# ─── Configuración de scraping de Prometheus ──────────────────────────────────
# Prometheus recoge métricas de cada target cada `scrape_interval` segundos
# y las almacena en su base de datos de series temporales (TSDB).
#
# Targets de este stack:
#   host.docker.internal:8081  → streamer (métricas TFG_*: FFmpeg, WebRTC, latencia)
#   node-exporter:9100         → métricas del SO del host (CPU, RAM, disco, red)
#   localhost:9090             → automonitorización de Prometheus
#
# Nota: host.docker.internal se resuelve a la IP del gateway del host Docker.
# Es necesario porque el streamer usa network_mode:host y no es alcanzable
# por nombre de servicio Docker.
# ──────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s      # recoger métricas de todos los targets cada 15 segundos
  evaluation_interval: 15s  # evaluar reglas de alertas cada 15 s (no hay reglas definidas aún)

scrape_configs:

  # ── Streamer WebRTC ────────────────────────────────────────────────────────
  # Scrapea las métricas TFG_* del servidor aiohttp Python.
  # Métricas disponibles:
  #   TFG_ffmpeg_bitrate_kbits, TFG_ffmpeg_fps, TFG_ffmpeg_speed
  #   TFG_ffmpeg_running, TFG_app_uptime_seconds
  #   TFG_webrtc_peers, TFG_webrtc_offers_total, TFG_webrtc_errors_total
  #   TFG_streaming_latency_* (avg, max, last, histograma)
  - job_name: 'webrtc-streamer'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8081']   # Docker Compose: streamer en red del host
        labels:
          instance: webrtc_streamer

  # ── Automonitorización de Prometheus ──────────────────────────────────────
  # Permite graficar en Grafana la duración del scraping, tamaño de colas, etc.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Node Exporter (métricas del SO) ───────────────────────────────────────
  # Métricas estándar de Linux: node_cpu_seconds_total, node_memory_*, node_disk_*, node_network_*
  # node-exporter es el nombre del servicio en docker-compose (se resuelve dentro de monitoring_network)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

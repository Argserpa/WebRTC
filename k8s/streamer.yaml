#  Streamer de vídeo (Kubernetes)
# Ejecuta el servidor Python de señalización FFmpeg + aiortc.
#
# Restricciones importantes:
#   hostNetwork: true  → aiortc tiene que anunciar la IP real del nodo en los ICE
#                        candidates; las IPs del pod (10.x.x.x) no son alcanzables
#                        desde los navegadores de la LAN
#   privileged: true   → acceder a la cámara V4L2 y al audio ALSA lo requiere
#   replicas: 1        → WebRTC es stateful (MediaRelay, PeerConnections activas);
#                        el escalado horizontal necesita una capa de sesión separada
#

#  PVC: segmentos HLS en vivo
# Compartido entre video-streamer (escribe) y hls-web (lee).
# FFmpeg va escribiendo continuamente los ficheros .m3u8 y los segmentos .ts aquí.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hls-data
  namespace: streaming
spec:
  accessModes:
    - ReadWriteOnce   # Minikube es single-node: los dos pods pueden montarlo a la vez
  resources:
    requests:
      storage: 2Gi
---
#  PVC: grabaciones
# Compartido entre video-streamer (escribe los .ts) y hls-web (los sirve para descarga).
# Cada grabación se almacena como /recordings/YYYY-MM-DD/HH-MM-SS.ts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recordings
  namespace: streaming
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi   # segmentos de 30 min a ~500 kbps ≈ 110 MB cada uno; la cifra escala con la duración esperada
---
#  ConfigMap: variables de entorno del streamer
# Equivalente al fichero .env de Docker Compose.
# Ver streamer/main.py para saber cómo se consume cada variable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamer-config
  namespace: streaming
data:
  INPUT: "/dev/video0"          # dispositivo de cámara V4L2
  USE_NVENC: "false"            # codificación hardware NVIDIA (requiere nodo con GPU)
  HLS_DIR: "/var/www/hls"       # directorio de salida HLS de FFmpeg (montado desde el PVC hls-data)
  RECORD_DIR: "/recordings"     # directorio de salida de grabaciones (montado desde el PVC recordings)
  UDP_PORT: "10000"             # puerto del pipe interno FFmpeg → MediaPlayer de aiortc
  VIDEO_SCALE: "1280:720"       # resolución de salida
  # Config del servidor TURN — TURN_SERVER_HOST coincide con la salida de 'minikube ip'
  TURN_SERVER_HOST: "192.168.49.2"   # IP del nodo Minikube (los ICE candidates usan esta dirección)
  TURN_SERVER_PORT: "3478"
  TURN_SERVER_USER: "turnuser"
  TURN_SERVER_PASS: "turnpass"
---
#  Deployment: video-streamer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-streamer
  namespace: streaming
  labels:
    app: video-streamer
spec:
  replicas: 1   # No escalar — las conexiones WebRTC están ligadas a la instancia de MediaRelay de este pod
  # Recreate (no RollingUpdate): este pod usa hostNetwork y ocupa el puerto de host 8081,
  # además de abrir en exclusiva la cámara /dev/video0. Con RollingUpdate el pod nuevo intenta
  # arrancar antes de matar el viejo y nunca puede: "didn't have free ports" (deadlock).
  # Recreate mata el pod viejo primero y luego crea el nuevo — es lo único viable aquí.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: video-streamer
  template:
    metadata:
      labels:
        app: video-streamer
    spec:
      # hostNetwork: aiortc genera los ICE candidates usando la IP real del nodo en lugar
      # de la IP interna del pod (10.x.x.x), que no es alcanzable desde los navegadores de la LAN.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet   # obligatorio con hostNetwork para seguir resolviendo DNS del cluster
      containers:
        - name: video-streamer
          image: video-streamer:latest
          imagePullPolicy: Never   # usar la imagen local de Minikube (eval $(minikube docker-env))
          envFrom:
            - configMapRef:
                name: streamer-config   # inyectar todas las claves del ConfigMap como variables de entorno
          ports:
            - name: signaling
              containerPort: 8081
              protocol: TCP
          securityContext:
            privileged: true   # necesario: acceso a /dev/video0 (V4L2) y /dev/snd (ALSA)
          volumeMounts:
            - name: hls-data
              mountPath: /var/www/hls
            - name: recordings
              mountPath: /recordings
            - name: video0
              mountPath: /dev/video0   # passthrough del dispositivo de cámara
            - name: snd
              mountPath: /dev/snd      # passthrough del directorio de la tarjeta de sonido ALSA
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"   # 2000m→4000m: a N=25 el SRTP de los 25 flujos saturaba 2 cores (1924m), throttling → el relay se atasca y dispara memoria + tumba el liveness. Nodo=32 cores.
              memory: "8Gi"   # holgado: 25 peers en estado estable ≈ 2.9Gi. El margen absorbe picos transitorios del relay.
          # Liveness probe: si /metrics deja de responder, reiniciar el pod
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8081
            initialDelaySeconds: 15   # esperar a que FFmpeg arranque antes del primer chequeo
            periodSeconds: 30
            timeoutSeconds: 5         # bajo carga alta el event loop tarda en responder; 1s (default) mataba el pod en falso
            failureThreshold: 3       # 3 fallos seguidos antes de reiniciar (evita reinicios por picos puntuales)
      volumes:
        - name: hls-data
          persistentVolumeClaim:
            claimName: hls-data
        - name: recordings
          persistentVolumeClaim:
            claimName: recordings
        - name: video0
          hostPath:
            path: /dev/video0
            type: CharDevice    # tiene que ser un dispositivo de caracteres o el pod no arranca
        - name: snd
          hostPath:
            path: /dev/snd
            type: Directory     # directorio de la tarjeta de sonido ALSA (contiene dispositivos controlC*, pcmC*)
---
#  Service: video-streamer
# El tipo LoadBalancer asigna una IP externa al pod para que los navegadores puedan
# hacer POST a /offer y establecer la conexión WebRTC.
# Requiere: minikube tunnel (en una terminal aparte para que se aprovisione la IP externa)
apiVersion: v1
kind: Service
metadata:
  name: video-streamer
  namespace: streaming
  labels:
    app: video-streamer
spec:
  type: LoadBalancer
  selector:
    app: video-streamer
  ports:
    - name: signaling
      port: 8081
      targetPort: 8081
      protocol: TCP

#  Secrets de Kubernetes
# Guarda las credenciales de administrador de Grafana como datos opacos en base64.
# El Deployment de Grafana las referencia via secretKeyRef para que las contraseñas
# en texto plano no queden en el manifest.
#
# Para regenerar:   echo -n 'micontraseña' | base64
#   admin       → YWRtaW4=
#   prom_admin  → cHJvbV9hZG1pbg==
#
# AVISO: base64 no es cifrado. Tratar este fichero como un fichero de contraseñas
# y nunca subir credenciales reales de producción al control de versiones.
#
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: streaming
type: Opaque
data:
  admin-user: YWRtaW4=         # "admin"
  admin-password: cHJvbV9hZG1pbg==  # "prom_admin"

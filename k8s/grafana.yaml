#  Dashboard Grafana (Kubernetes)
# Grafana es la capa de visualización de las métricas de Prometheus.
# Las credenciales de administrador se inyectan desde el Secret grafana-credentials (01-secrets.yaml).
# El PVC persiste dashboards y configuración de datasources entre reinicios del pod.
#

#  PVC: almacenamiento persistente de Grafana
# Guarda dashboards, usuarios, plugins y configuración de datasources en disco.
# ReadWriteOnce es suficiente para un cluster Minikube de un solo nodo.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: streaming
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
#  Deployment: grafana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: streaming
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # Grafana necesita estos IDs para ser propietario de /var/lib/grafana en el PVC
      securityContext:
        fsGroup: 472    # GID 472 = grupo grafana en la imagen oficial
        runAsUser: 472  # UID 472 = usuario grafana en la imagen oficial
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          env:
            # Credenciales de administrador cargadas desde el Secret para evitar texto plano en el manifest
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
            - name: GF_LOG_LEVEL
              value: "error"    # nivel bajo de logs; "info" muestra más detalle para depuración
          ports:
            - name: web
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana   # dashboards y config persistentes
          resources:
            requests:
              cpu: "150m"
              memory: "512Mi"
            limits:
              # El working set de grafana/grafana:latest supera 512Mi una vez caliente
              # (se comprobó: OOMKilled a los ~73s con 256Mi y de nuevo a los ~171s con 512Mi,
              # exit 137, sin panic interno → era el límite del cgroup, no un fallo de Grafana).
              # El nodo tiene 52Gi libres, así que damos 1Gi de techo (muy por encima de los
              # ~550-600Mi reales) para eliminar el CrashLoopBackOff y el "NetworkError" del navegador.
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
#  Service: grafana
# NodePort hace Grafana accesible desde fuera del cluster sin necesitar 'minikube tunnel'.
# Acceder en: http://<ip-minikube>:30300
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: streaming
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30300   # NodePort fijo: http://<ip-minikube>:30300

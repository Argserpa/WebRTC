#  Servidor TURN/STUN coturn (Kubernetes)
# Proporciona relay ICE para WebRTC cuando el P2P directo queda bloqueado por NAT.
# La external-ip del ConfigMap tiene que apuntar a la IP del nodo Minikube
# para que los ICE candidates anuncien una dirección alcanzable.
#

#  ConfigMap: configuración de coturn
# Se inyecta como /etc/turnserver.conf en el contenedor de coturn.
# Ver coturn/turnserver.conf para la documentación campo a campo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: streaming
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    # IP del nodo Minikube (la que devuelve 'minikube ip')
    external-ip=192.168.49.2
    user=turnuser:turnpass
    realm=yourdomain.com
    verbose
    min-port=49152
    max-port=65535
    allowed-peer-ip=0.0.0.0-255.255.255.255
---
#  Deployment: coturn
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: streaming
  labels:
    app: coturn
spec:
  replicas: 1   # el servidor TURN es stateful (allocaciones activas); no escalar horizontalmente
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/turnserver.conf"   # usar el fichero de config inyectado desde el ConfigMap
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turns             # TURNS = TURN sobre TLS
              containerPort: 5349
              protocol: TCP
          volumeMounts:
            - name: coturn-config
              mountPath: /etc/turnserver.conf
              subPath: turnserver.conf   # montar solo esta clave, no el ConfigMap entero
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      volumes:
        - name: coturn-config
          configMap:
            name: coturn-config
---
#  Service: coturn
# NodePort expone los puertos TURN directamente en el nodo Minikube para que los
# navegadores fuera del cluster puedan llegar al servidor TURN para allocar ICE candidates.
apiVersion: v1
kind: Service
metadata:
  name: coturn
  namespace: streaming
  labels:
    app: coturn
spec:
  type: NodePort   # obligatorio: los ICE candidates de los navegadores tienen que alcanzar estos puertos
  selector:
    app: coturn
  ports:
    - name: turn-udp
      port: 3478
      targetPort: 3478
      nodePort: 30478   # acceder en <ip-minikube>:30478 (UDP)
      protocol: UDP
    - name: turn-tcp
      port: 3478
      targetPort: 3478
      nodePort: 30479   # acceder en <ip-minikube>:30479 (TCP)
      protocol: TCP
